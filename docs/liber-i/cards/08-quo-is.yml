  - id: i08-c-in-culinam
    type: choose
    q: "*Marcus in ___ currit.* (into the kitchen)"
    options: [culīnam, culīnā]
    a: culīnam
    why: "Motion into: *in* + accusative."
    ref: g-04
  - id: i08-c-in-culina
    type: choose
    q: "*Iūlia in ___ sedet.* (in the kitchen)"
    options: [culīnā, culīnam]
    a: culīnā
    why: "Sitting still: *in* + ablative, long *-ā*."
    ref: g-04
  - id: i08-c-eunt
    type: choose
    q: "*Puerī ad forum ___.* (go)"
    options: [eunt, it, īmus]
    a: eunt
    why: "Many boys: \"they go,\" *eunt*."
    ref: g-02
  - id: i08-c-imus
    type: choose
    q: "*Nōs domum ___.* (go)"
    options: [īmus, ītis, eunt]
    a: īmus
    why: "*Nōs*, \"we\": the *-mus* form, *īmus*."
    ref: g-02
  - id: i08-c-domum
    type: choose
    q: "\"I'm going home.\" *___ eō.*"
    options: [Domum, Domī, Domō]
    a: Domum
    why: "*Domum* is \"to home\"; *domī* is \"at home,\" *domō* \"from home.\""
    ref: g-06
  - id: i08-c-romae
    type: choose
    q: "\"We live in Rome.\" *___ habitāmus.*"
    options: [Rōmae, Rōmam, Rōmā]
    a: Rōmae
    why: "\"At Rome\" is the locative *Rōmae*; *Rōmam* is \"to,\" *Rōmā* \"from.\""
    ref: g-07
  - id: i08-c-quo
    type: choose
    q: "*___ īs? Ad tabernam.*"
    options: [Quō, Ubi, Unde]
    a: Quō
    why: "*Quō* asks \"where to?\"; *ubi* \"where?\"; *unde* \"from where?\""
    ref: g-01
  - id: i08-c-per
    type: choose
    q: "\"through the streets\": *per ___*"
    options: [viās, viīs]
    a: viās
    why: "*Per* always takes the accusative."
    ref: g-05
  - id: i08-c-circum-sit
    type: choose
    q: "*Circum ___ sedent.* (They sit around the table.)"
    options: [mēnsam, mēnsā]
    a: mēnsam
    why: "*Circum* takes the accusative even with no motion."
    ref: g-05
  - id: i08-e-in-culinam-sum
    type: error
    q: "*In culīnam sum.* (I'm in the kitchen.) What's wrong?"
    a: "*In culīnā sum.* Being somewhere is *in* + ablative; *in culīnam* is \"into.\""
    ref: g-04
  - id: i08-e-ad-romam
    type: error
    q: "*Ad Rōmam habitō.* (I live in Rome.) What's wrong?"
    a: "*Rōmae habitō.* A town takes the locative, no preposition."
    ref: g-07
  - id: i08-e-domi-eo
    type: error
    q: "*Domī eō.* (I'm going home.) What's wrong?"
    a: "*Domum eō.* *Domī* is \"at home\"; \"to home\" is *domum*."
    ref: g-06
  - id: i08-e-in-domum
    type: error
    q: "*In domum eō.* (I'm going home.) What's wrong?"
    a: "*Domum eō.* Like a town name, *domum* needs no preposition."
    ref: g-06
  - id: i08-e-per-viis
    type: error
    q: "*Per viīs ambulāmus.* What's wrong?"
    a: "*Per viās ambulāmus.* *Per* takes the accusative."
    ref: g-05
