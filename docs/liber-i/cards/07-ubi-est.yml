  - id: i07-c-mensa
    type: choose
    q: "*Cāseus in ___ est.* (on the table)"
    options: [mēnsā, mēnsa]
    a: mēnsā
    why: "After *in*, the *-a* noun stretches to long *-ā*."
    ref: g-02
  - id: i07-c-ex-atrio
    type: choose
    q: "\"out of the front hall\": *___ ātriō*"
    options: [ex, ē]
    a: ex
    why: "*Ē* only goes before a consonant; *ātriō* starts with a vowel."
    ref: g-05
  - id: i07-c-ab-oppido
    type: choose
    q: "\"away from the town\": *___ oppidō*"
    options: [ab, ā]
    a: ab
    why: "*Ā* only goes before a consonant; *oppidō* starts with a vowel."
    ref: g-05
  - id: i07-c-hortis
    type: choose
    q: "*In ___ sumus.* (in the gardens)"
    options: [hortīs, hortōs, hortō]
    a: hortīs
    why: "Plural ablative is *-īs* in every family."
    ref: g-04
  - id: i07-c-ubi-unde
    type: choose
    q: "*___ venīs? Ē tabernā.*"
    options: [Unde, Ubi]
    a: Unde
    why: "*Unde* asks \"from where?\"; *ubi* asks plain \"where?\""
    ref: g-06
  - id: i07-c-cum
    type: choose
    q: "*Vīnum ___ aquā bibimus.* (with water)"
    options: [cum, sine]
    a: cum
    why: "*Cum* is \"with\"; *sine* is \"without.\""
    ref: g-07
  - id: i07-c-mensa-subj
    type: choose
    q: "*Ecce, ___ vacua est.* (the table is empty)"
    options: [mēnsa, mēnsā]
    a: mēnsa
    why: "No preposition: the table is the subject, so it's nominative, short *-a*."
    ref: g-08
  - id: i07-e-in-mensa
    type: error
    q: "*In mensa est.* (It's on the table.) What's wrong?"
    a: "*In mēnsā est.* Long ē in the stem, and long ā after *in*."
    ref: g-02
  - id: i07-e-e-atrio
    type: error
    q: "*Ē ātriō venit.* What's wrong?"
    a: "*Ex ātriō venit.* *Ē* never goes before a vowel."
    ref: g-05
  - id: i07-e-in-hortos
    type: error
    q: "*In hortōs sumus.* (We're in the gardens.) What's wrong?"
    a: "*In hortīs sumus.* Sitting still takes the ablative: *-īs*."
    ref: g-04
  - id: i07-e-cum-amicus
    type: error
    q: "*Cum amīcus veniō.* What's wrong?"
    a: "*Cum amīcō veniō.* *Cum* takes the ablative."
    ref: g-07
  - id: i07-e-a-oppido
    type: error
    q: "*Ā oppidō currit.* What's wrong?"
    a: "*Ab oppidō currit.* A vowel needs the full *ab*."
    ref: g-05
