  - {id: i06-f-rebels, type: forms, q: "The four short commands (to one; to y'all)?", a: "*dīc, dūc, fac, fer* · *dīcite, dūcite, facite, ferte*", ref: g-07}
  - {id: i06-f-again, type: forms, q: "\"Say it again, please.\"", a: "*Dīc iterum, quaesō.*", ref: g-07}
