  - id: i06-c-es-es
    type: choose
    q: "*Tū bonus ___.* (You are good.)"
    options: [es, ēs]
    a: es
    why: "Short *es* is \"you are\"; long *ēs* is \"you eat\" (a short form of *edis*)."
    ref: g-02
  - id: i06-c-veni
    type: choose
    q: "Caesar: *___, vīdī, vīcī.* (I came, I saw, I conquered.)"
    options: [vēnī, venī]
    a: vēnī
    why: "Long ē *vēnī* is \"I came\"; short e *venī* is \"come!\""
    ref: g-09
  - id: i06-c-legite
    type: choose
    q: "\"Read, y'all!\" *___ librum!*"
    options: [Legite, Legete]
    a: Legite
    why: "The third family turns its e into i before *-te*."
    ref: g-06
  - id: i06-c-noli
    type: choose
    q: "\"Don't laugh!\" *Nōlī ___!*"
    options: [rīdēre, rīdē]
    a: rīdēre
    why: "After *nōlī*, use the infinitive."
    ref: g-08
  - id: i06-c-audis
    type: choose
    q: "*Tū ___.* (You hear.)"
    options: [audīs, audis]
    a: audīs
    why: "The ī family keeps its long ī: *audīs*. Short i is the *legis* family."
    ref: g-03
  - id: i06-c-capiunt
    type: choose
    q: "\"They take\": *___*"
    options: [capiunt, capunt]
    a: capiunt
    why: "-iō verbs show their i in \"I\" and \"they\": *capiō, capiunt*."
    ref: g-04
  - id: i06-c-answer
    type: choose
    q: "*Audīte, discipulī!* Answer for the class: *___.*"
    options: [Audīmus, Audiō]
    a: Audīmus
    why: "A command to y'all gets a \"we\" answer: *-mus*."
    ref: g-09
  - id: i06-e-dice
    type: error
    q: "*Dīce iterum, quaesō.* What's wrong?"
    a: "*Dīc iterum.* *Dīc* is one of the four rebels with no *-e*."
    ref: g-07
  - id: i06-e-noli-time
    type: error
    q: "*Nōlī timē!* What's wrong?"
    a: "*Nōlī timēre!* *Nōlī* takes the infinitive."
    ref: g-08
  - id: i06-e-audunt
    type: error
    q: "*Puerī audunt.* What's wrong?"
    a: "*Puerī audiunt.* The ī family keeps its i in \"they\"."
    ref: g-03
  - id: i06-e-legimus-macron
    type: error
    q: "*legīmus* · *audīmus*: which is wrong?"
    a: "*legīmus* → *legimus*. The third family's i is short."
    ref: g-01
  - id: i06-e-ferite
    type: error
    q: "*Ferite aquam!* (to y'all) What's wrong?"
    a: "*Ferte aquam!* *Fer* drops the i in the plural too."
    ref: g-07
