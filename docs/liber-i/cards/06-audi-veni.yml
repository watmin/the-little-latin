  - {id: i06-f-audio-six, type: forms, q: "Chant *audiō* through all six persons.", a: "*audiō, audīs, audit, audīmus, audītis, audiunt*", ref: g-03}
  - {id: i06-f-capio-six, type: forms, q: "Chant *capiō* through all six persons.", a: "*capiō, capis, capit, capimus, capitis, capiunt*", ref: g-04}
  - {id: i06-f-families, type: forms, q: "*legere* vs *docēre*: which family is each?", a: "*legere* (short e): 3rd conjugation. *docēre* (long ē): 2nd.", ref: g-02}
  - {id: i06-f-clip, type: forms, q: "How do you make a command to one person?", a: "Clip *-re* off the infinitive: *audīre → audī*, *legere → lege*.", ref: g-05}
