  - id: i04-c-who-loves
    type: choose
    q: "*Puellam puer amat.* Who loves whom?"
    options: ["the boy loves the girl", "the girl loves the boy"]
    a: "the boy loves the girl"
    why: "*Puer* is nominative, *puellam* accusative. Endings over order."
    ref: g-05
  - id: i04-c-quis-quem
    type: choose
    q: "Marcus sees someone. ___ videt Marcus?"
    options: [quis, quem]
    a: quem
    why: "The person seen is the object, so the accusative *quem*."
    ref: g-06
  - id: i04-c-aquam
    type: choose
    q: "*Quid bibit Iūlia?* ___ bibit."
    options: [aqua, aquam]
    a: aquam
    why: "The answer keeps the case of what's asked about: she drinks it, so object, *aquam*."
    ref: g-06
  - id: i04-c-emunt
    type: choose
    q: "*Nautae vīnum ___.* (buy)"
    options: [emit, emunt]
    a: emunt
    why: "Several sailors, so *-unt*. The *-it* verbs make *-unt*, not *-int*."
    ref: g-08
  - id: i04-e-iulia-aqua
    type: error
    q: "*Iūlia aqua bibit.* What's wrong?"
    a: "*Iūlia aquam bibit.* The water is the object."
    ref: g-03
  - id: i04-e-ovas
    type: error
    q: "*Agricolae ōvās vendunt.* What's wrong?"
    a: "*Agricolae ōva vendunt.* Neuter twins: *ōva* stays *ōva*."
    ref: g-08
  - id: i04-e-puer-puella
    type: error
    q: "*Puer puella videt.* (The boy sees the girl.) What's wrong?"
    a: "*Puer puellam videt.* The girl is the object."
    ref: g-05
  - id: i04-e-pueri-edit
    type: error
    q: "*Puerī mālum edit.* What's wrong?"
    a: "*Puerī mālum edunt.* The verb agrees with its plural subject."
    ref: g-08
