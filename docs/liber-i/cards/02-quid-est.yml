  - id: i02-c-est-sunt
    type: choose
    q: "*Ūvae ___.*"
    options: [est, sunt]
    a: sunt
    why: "*Ūvae* is plural, so the verb is plural: *sunt*."
    ref: g-04
  - id: i02-c-nonne-num
    type: choose
    q: "You expect yes: \"___ mālum est?\" (Isn't it an apple?)"
    options: [nōnne, num]
    a: nōnne
    why: "*Nōnne* expects yes; *num* expects no."
    ref: g-08
  - id: i02-c-quid-sunt
    type: choose
    q: "Holding up some grapes: ___ sunt?"
    options: [quis, quid]
    a: quid
    why: "Grapes are things, so *quid*."
    ref: g-04
  - id: i02-e-mala-est
    type: error
    q: "*Māla est.* What's wrong?"
    a: "*Māla sunt.* Plural subject, plural verb."
    ref: g-09
  - id: i02-e-mala-apples
    type: error
    q: "Serving apples: *mala sunt*. What's wrong?"
    a: "*Māla sunt.* Without the long ā, you're serving bad things."
    ref: g-04
