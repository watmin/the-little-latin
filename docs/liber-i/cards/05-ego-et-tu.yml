  - id: i05-c-sum-acc
    type: choose
    q: "*___ sum.* (I'm a student, male)"
    options: [discipulus, discipulum]
    a: discipulus
    why: "After *sum*, the noun naming the subject stays nominative."
    ref: g-04
  - id: i05-c-answer-person
    type: choose
    q: "*Labōrātisne?* Answer yes for the group: *Ita, ___.*"
    options: [labōrāmus, labōrō]
    a: labōrāmus
    why: "Asked with *-tis* (y'all), answer with *-mus* (we)."
    ref: g-06
  - id: i05-c-valeo
    type: choose
    q: "*Quid agis?* \"I'm well.\""
    options: [valeō, valē]
    a: valeō
    why: "*Valeō* is \"I am well\"; *valē* is \"be well!\", goodbye."
    ref: g-06
  - id: i05-c-es-est
    type: choose
    q: "*Tū bonus ___.* (You are good.)"
    options: [es, est]
    a: es
    why: "*Tū* is 2nd person singular: *es*. *Est* is he, she, it."
    ref: g-04
  - id: i05-e-ego-cantat
    type: error
    q: "*Ego cantat.* What's wrong?"
    a: "*Ego cantō.* \"I\" needs *-ō*."
    ref: g-02
  - id: i05-e-nos-laborant
    type: error
    q: "*Nōs labōrant.* What's wrong?"
    a: "*Nōs labōrāmus.* \"We\" needs *-mus*."
    ref: g-02
  - id: i05-e-habeo-macron
    type: error
    q: "*habēō* · *habēmus*: which is wrong?"
    a: "*habēō* → *habeō*. A vowel before another vowel is short."
    ref: g-03
  - id: i05-e-tu-sum
    type: error
    q: "*Tū sum discipulus.* What's wrong?"
    a: "*Tū es discipulus.* \"You\" takes *es*; *sum* is \"I am.\""
    ref: g-04
