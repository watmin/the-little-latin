  - {id: i05-f-endings, type: forms, q: "The six present endings, in order?", a: "*-ō, -s, -t, -mus, -tis, -nt*", ref: g-02}
  - {id: i05-f-amo-six, type: forms, q: "Chant *amō* through all six persons.", a: "*amō, amās, amat, amāmus, amātis, amant*", ref: g-02}
