  - id: i01-c-salve-salvete
    type: choose
    q: "The teacher greets the whole class: ___, discipulī!"
    options: [salvē, salvēte]
    a: salvēte
    why: "*-te* is for more than one person; *salvē* greets one."
    ref: g-12
  - id: i01-c-vale-valete
    type: choose
    q: "Two friends leave. You say ___!"
    options: [valē, valēte]
    a: valēte
    why: "Two people, so add *-te*."
    ref: g-08
  - id: i01-c-quis-quid
    type: choose
    q: "Someone knocks at the door. ___ est?"
    options: [quis, quid]
    a: quis
    why: "*Quis* asks about a person; *quid* asks about a thing."
    ref: g-10
  - id: i01-c-malum-macron
    type: choose
    q: "Which one is the apple?"
    options: [mālum, malum]
    a: mālum
    why: "Long *ā* is the apple; short *a* is a bad thing. The macron is the whole difference."
    ref: g-01
  - {id: i01-f-c-hard, type: forms, q: "How is the *c* in *Cicerō* said?", a: "Hard, like k: KI-ke-rō.", ref: g-04}
  - {id: i01-f-v-w, type: forms, q: "How is the *v* in *salvē* said?", a: "Like English w: SAL-wē.", ref: g-06}
  - {id: i01-f-ae, type: forms, q: "How is *ae* said, as in *quaesō*?", a: "\"eye\": KWAI-sō.", ref: g-03}
  - id: i01-e-salve-many
    type: error
    q: "John greets three students: *Salvē, discipulī!* What's wrong?"
    a: "*Salvēte!* Three people need *-te*."
    ref: g-08
  - id: i01-e-church-c
    type: error
    q: "*Cicerō* read as CHEE-che-rō. What's wrong for this course?"
    a: "That's Church Latin. Classical *c* is always hard: KI-ke-rō."
    ref: g-04
