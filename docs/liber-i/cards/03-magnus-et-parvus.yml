  - id: i03-c-agricola
    type: choose
    q: "A good farmer: *agricola* ___"
    options: [bonus, bona]
    a: bonus
    why: "Agreement follows gender, not rhyme. *Agricola* is masculine."
    ref: g-04
  - id: i03-c-mala-magna
    type: choose
    q: "Big apples: *māla* ___"
    options: [magna, magnae]
    a: magna
    why: "*Māla* is neuter plural, so the adjective takes neuter plural *-a*."
    ref: g-10
  - id: i03-c-et-sed
    type: choose
    q: "The cheese is salty ___ good: *Cāseus salsus ___ bonus est.*"
    options: [et, sed]
    a: sed
    why: "Salty-but-good is a contrast, so *sed*."
    ref: g-08
  - id: i03-e-vinum-alba
    type: error
    q: "*Vīnum alba.* What's wrong?"
    a: "*Vīnum album.* *Vīnum* is neuter."
    ref: g-05
  - id: i03-e-mensa-magnum
    type: error
    q: "*Mēnsa magnum.* What's wrong?"
    a: "*Mēnsa magna.* *Mēnsa* is feminine."
    ref: g-02
  - id: i03-e-agricola-bona
    type: error
    q: "*Agricola bona est.* What's wrong?"
    a: "*Agricola bonus est.* The farmer is masculine; don't follow the rhyme."
    ref: g-04
