  - {id: i09-v-dominus, type: vocab, la: "dominus · dominī", en: "master (of the house); lord", ref: g-04}
  - {id: i09-v-domina, type: vocab, la: "domina · dominae", en: "mistress (of the house); lady", ref: g-04}
