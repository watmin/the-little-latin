  en: f. nature
  ref: g-14
- id: vi66-v-positio-positionis
  type: vocab
  la: positiō, positiōnis
  en: f. placing, position
  ref: g-14
- id: vi66-v-accentus-accentus
  type: vocab
  la: accentus, accentūs
  en: m. accent, stress
  ref: g-14
- id: vi66-v-acutus-a-um
  type: vocab
  la: acūtus, -a, -um
  en: sharp; (of a syllable) stressed
  ref: g-15
- id: vi66-v-volucris-volucris
  type: vocab
  la: volucris, volucris
