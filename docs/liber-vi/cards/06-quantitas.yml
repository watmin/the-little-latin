cards:
- id: vi66-v-syllaba-longa-duo-tempora
  type: vocab
  la: Syllaba longa duo tempora habet, brevis ūnum.
  en: A long syllable has two beats, a short one one. (after Quintilian)
  ref: g-02
- id: vi66-v-avus-est-avus-est
  type: vocab
  la: Avus est · Avus ēst
  en: Grandpa is · Grandpa eats (both first syllables long; the vowels differ)
  ref: g-04
- id: vi66-v-deaque-itaque
  type: vocab
  la: deaque · itaque
  en: de-A-que "and the goddess" · i-TA-que "and so" (a tag pulls the stress)
  ref: g-09
- id: vi66-v-quantity
  type: vocab
  la: quantity
  en: 'how long a syllable lasts: long or short (*quantitās*)'
  ref: g-01
- id: vi66-v-long-by-nature
  type: vocab
  la: long by nature
  en: '"born long": the syllable has a long vowel or a diphthong (*mā-, -lae*)'
  ref: g-03
- id: vi66-v-long-by-position
  type: vocab
  la: long by position
  en: '"long by its neighbors": a short vowel with two consonants (or *x, z*) after it (*sub t-, ter-ra*)'
  ref: g-04
- id: vi66-v-common-syllable
  type: vocab
  la: common syllable
  en: 'the either-way syllable: a short vowel before a stop + *l* or *r* (*pa-trem*); short in speech, may be long in verse'
  ref: g-05
- id: vi66-v-ultima
  type: vocab
  la: ultima
  en: the last syllable of a word
  ref: g-07
- id: vi66-v-antepenult
  type: vocab
  la: antepenult
  en: the third syllable from the end (*TEG-mi-ne*)
  ref: g-07
- id: vi66-v-breve
  type: vocab
  la: breve
  en: the short mark ˘ over a syllable ("the cup")
  ref: g-02
- id: vi66-v-quantitas-quantitatis
  type: vocab
  la: quantitās, quantitātis
  en: f. quantity, size; the length of a syllable
  ref: g-01
- id: vi66-v-syllaba-syllabae
  type: vocab
  la: syllaba, syllabae
  en: f. syllable
  ref: g-01
- id: vi66-v-longus-a-um
  type: vocab
  la: longus, -a, -um
  en: long
  ref: g-01
- id: vi66-v-brevis-breve
  type: vocab
  la: brevis, breve
  en: short
  ref: g-01
