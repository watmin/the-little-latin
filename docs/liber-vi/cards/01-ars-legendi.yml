book: vi
ch: 61
page: liber-vi/01-ars-legendi.md
cards:
- id: vi61-v-ars-legendi
  type: vocab
  la: "Ars legendī."
  en: "The art of reading."
  ref: g-01
- id: vi61-v-legendo-discimus
  type: vocab
  la: "Legendō discimus."
  en: "We learn by reading."
  ref: g-07
- id: vi61-v-tempus-est-edendi
  type: vocab
  la: "Tempus est edendī!"
  en: "It's time to eat! (time for eating)"
  ref: g-04
- id: vi61-v-avus-edendi-cupidus
  type: vocab
  la: "Avus edendī cupidus est."
  en: "Grandpa is eager to eat."
  ref: g-04
- id: vi61-v-ad-legendum-paratus
  type: vocab
  la: "Ad legendum parātus sum."
  en: "I'm ready to read."
  ref: g-06
- id: vi61-v-edendi-causa-venit
  type: vocab
  la: "Edendī causā venit."
  en: "He comes to eat (for the sake of eating)."
  ref: g-05
- id: vi61-v-gerund
  type: vocab
  la: "gerund"
  en: "the verb-noun: -ndī, -ndō, -ndum; English \"-ing\" as a noun"
  ref: g-01
- id: vi61-v-legendi-legendo-legendum
  type: vocab
  la: "legendī, legendō, legendum"
  en: "of reading · by reading · (ad legendum) for reading"
  ref: g-03
- id: vi61-v-eundi
  type: vocab
  la: "eundī"
  en: "of going (gerund of eō)"
  ref: g-08
- id: vi61-v-causa-gratia
  type: vocab
  la: "causā, grātiā"
  en: "for the sake of (after a genitive: edendī causā)"
  ref: g-05
- id: vi61-v-paratus
  type: vocab
  la: "parātus, -a, -um"
  en: "ready (ad + gerund)"
  ref: g-06
- id: vi61-v-idoneus
  type: vocab
  la: "idōneus, -a, -um"
  en: "fit, suitable (ad + gerund)"
  ref: g-06
- id: vi61-v-studiosus
  type: vocab
  la: "studiōsus, -a, -um"
  en: "keen on, eager for (+ genitive)"
  ref: g-09
- id: vi61-v-carmen
  type: vocab
  la: "carmen, carminis"
  en: "n. song, poem"
  ref: g-04
- id: vi61-v-lector
  type: vocab
  la: "lēctor, lēctōris"
  en: "m. reader"
  ref: g-09
- id: vi61-v-auctor
  type: vocab
  la: "auctor, auctōris"
  en: "m. author (Book VI: Ad Auctōrēs)"
  ref: g-15
- id: vi61-f-01
  type: forms
  q: "Translate *Dīcendō discimus.* What is *dīcendō*?"
  a: "\"We learn by speaking.\" A gerund in the ablative: \"by speaking.\""
  ref: g-01
- id: vi61-f-02
  type: forms
  q: "What is a gerund, in plain words?"
  a: "The verb-noun: a verb used as a noun, English \"-ing\" as a thing (\"the art of reading\")."
  ref: g-01
- id: vi61-f-03
  type: forms
  q: "Translate *Errandō discitur.*"
  a: "\"One learns by making mistakes.\" *Errandō*: ablative gerund."
  ref: g-01
- id: vi61-f-04
  type: forms
  q: "Gerund \"of\" form of *amō, habeō, legō, capiō, audiō*?"
  a: "*amandī, habendī, legendī, capiendī, audiendī*"
  ref: g-02
- id: vi61-f-05
  type: forms
  q: "Shortcut from Chapter 38's participle to the gerund?"
  a: "Swap *-ntis* for *-ndī*: *legentis → legendī, audientis → audiendī*."
  ref: g-02
- id: vi61-f-06
  type: forms
  q: "Long or short: the vowel before *-nd-* in *amandī*? Where's the stress?"
  a: "Short (like *amantis*). Stress on it: a-MAN-dī."
  ref: g-02
- id: vi61-f-07
  type: forms
  q: "Gerund \"of\" form of *dormiō, currō, pugnō, videō*?"
  a: "*dormiendī, currendī, pugnandī, videndī*"
  ref: g-02
- id: vi61-f-08
  type: forms
  q: "Law of *-nd-*: how is a gerund built?"
  a: "Present stem + *-nd-* + case ending (*-and-, -end-, -iend-*); short vowel before *-nd-*."
  ref: g-02
- id: vi61-f-09
  type: forms
  q: "The four cases of the gerund of *legō*? Which case is missing?"
  a: "Gen. *legendī*, dat. *legendō*, acc. *legendum*, abl. *legendō*. No nominative (and no plural)."
  ref: g-03
- id: vi61-f-10
  type: forms
  q: "\"Reading is pleasant.\""
  a: "*Legere iūcundum est.* A subject is the infinitive, never the gerund."
  ref: g-03
- id: vi61-f-11
  type: forms
  q: "\"I love reading.\""
  a: "*Amō legere.* A plain object is the infinitive too."
  ref: g-03
- id: vi61-f-12
  type: forms
  q: "Law of the Missing Nominative: which verb-noun does which job?"
  a: "Infinitive: subject and plain object. Gerund: of ___ing (gen.), *ad* ___ing (acc.), by / in ___ing (abl.)."
  ref: g-03
- id: vi61-f-13
  type: forms
  q: "\"It's time for eating!\""
  a: "*Tempus est edendī!* Latin: \"the time of eating.\""
  ref: g-04
- id: vi61-f-14
  type: forms
  q: "\"Marcus is skilled at reading.\" (*perītus*)"
  a: "*Marcus legendī perītus est.*"
  ref: g-04
- id: vi61-f-15
  type: forms
  q: "Translate *hominēs bellandī cupidī magnō dolōre adficiēbantur.* (Caesar)"
  a: "\"Men eager for making war were greatly upset on this score.\" *Bellandī*: genitive gerund after *cupidī*."
  ref: g-04
- id: vi61-f-16
  type: forms
  q: "Translate *Sī quis in hōc artem populō nōn nōvit amandī, hoc legat…* (Ovid)"
  a: "\"If anyone among this people doesn't know the art of loving, let him read this…\""
  ref: g-04
- id: vi61-f-17
  type: forms
  q: "Translate *Stilus optimus et praestantissimus dīcendī effector ac magister.* (Cicero)"
  a: "\"The pen is the best and most outstanding maker and teacher of speaking.\" (*est* understood)"
  ref: g-04
- id: vi61-f-18
  type: forms
  q: "Translate *Hunc tantā cupiditāte incendit bellandī, ut … arma cōnātus sit īnferre Ītaliae.* (Nepos)"
  a: "\"He fired him with such a desire for making war that he tried to carry arms against Italy.\""
  ref: g-04
- id: vi61-f-19
  type: forms
  q: "\"Grandpa comes for the sake of eating.\""
  a: "*Avus edendī causā venit.* (or *grātiā*; gerund first, *causā* after)"
  ref: g-05
- id: vi61-f-20
  type: forms
  q: "\"We read for the sake of learning.\""
  a: "*Legimus discendī causā.* (or *grātiā*)"
  ref: g-05
- id: vi61-f-21
  type: forms
  q: "*Avus venit ut edat* vs *Avus edendī causā venit*: same meaning?"
  a: "Yes, both goals. The *ut* clause has its own subject and subjunctive; the gerund phrase has none."
  ref: g-05
- id: vi61-f-22
  type: forms
  q: "When does the accusative gerund (*legendum*) appear?"
  a: "Only after a preposition, nearly always *ad*: *ad legendum*, \"for reading, in order to read.\""
  ref: g-06
- id: vi61-f-23
  type: forms
  q: "\"Grandpa is ready for eating.\""
  a: "*Avus ad edendum parātus est.*"
  ref: g-06
- id: vi61-f-24
  type: forms
  q: "Translate *nactus idōneam ad nāvigandum tempestātem tertiā ferē vigiliā solvit.* (Caesar)"
  a: "\"Having got weather fit for sailing, he set sail at about the third watch.\""
  ref: g-06
- id: vi61-f-25
  type: forms
  q: "\"Grandpa came to eat\": three ways."
  a: "*ut ederet · edendī causā · ad edendum*"
  ref: g-06
- id: vi61-f-26
  type: forms
  q: "Translate *hominēs, dum docent, discunt* (Seneca) and *Docendō discimus*."
  a: "\"People learn while they teach.\" \"We learn by teaching.\""
  ref: g-07
- id: vi61-f-27
  type: forms
  q: "Translate *Gutta cavat lapidem, nōn vī sed saepe cadendō.*"
  a: "\"A drop hollows the stone, not by force but by falling often.\" *Cadendō*: by falling."
  ref: g-07
- id: vi61-f-28
  type: forms
  q: "Translate *Cum in apparandō ācerrimē esset occupātus…* (Nepos)"
  a: "\"While he was very busily occupied in preparing…\" *In* + ablative gerund."
  ref: g-07
- id: vi61-f-29
  type: forms
  q: "Translate *quis tālia fandō … temperet ā lacrimīs?* (Vergil)"
  a: "\"Who, in telling such things, could hold back from tears?\" *Fandō*: gerund of *for, fārī*."
  ref: g-07
- id: vi61-f-30
  type: forms
  q: "Law of the Four Jobs: what does each case of the gerund do?"
  a: "Gen. *-ndī*: of ___ing, + *causā*. Acc. *-ndum*: after *ad*, for ___ing. Abl. *-ndō*: by ___ing; *in*: in ___ing. Dat.: rare."
  ref: g-07
- id: vi61-f-31
  type: forms
  q: "Gerund of *eō*? \"It's time to go!\""
  a: "*eundī* (*euntis → eundī*). *Tempus est eundī!*"
  ref: g-08
- id: vi61-f-32
  type: forms
  q: "Gerund of *ferō*? Of *sum* and *possum*?"
  a: "*ferendī*. *Sum* and *possum* have no gerund in classical Latin."
  ref: g-08
- id: vi61-f-33
  type: forms
  q: "Translate *tempus tacendī et tempus loquendī.* What's odd about *loquendī*?"
  a: "\"A time to keep silent and a time to speak.\" A deponent's gerund: ordinary form, active meaning."
  ref: g-08
- id: vi61-f-34
  type: forms
  q: "Translate *tempus nāscendī et tempus moriendī.*"
  a: "\"A time to be born and a time to die.\" Two deponents, ordinary gerunds."
  ref: g-08
- id: vi61-f-35
  type: forms
  q: "*Avus legēns dormit* vs *Avus legendō dormit*?"
  a: "\"Grandpa falls asleep (while) reading\" (participle, agrees) vs \"Grandpa falls asleep from reading\" (gerund, ablative)."
  ref: g-09
- id: vi61-f-36
  type: forms
  q: "\"the reading girl\" vs \"a girl keen on reading\""
  a: "*puella legēns* · *puella legendī studiōsa*"
  ref: g-09
- id: vi61-f-37
  type: forms
  q: "Law of the Two *-ing*s: how do you tell them apart?"
  a: "*-ns / -nt-*: participle, an adjective that agrees. *-nd-*: gerund, a noun that agrees with nobody."
  ref: g-09
- id: vi61-f-38
  type: forms
  q: "\"We learn by reading books.\""
  a: "*Librōs legendō discimus.* The gerund takes an object."
  ref: g-10
- id: vi61-f-39
  type: forms
  q: "Translate *faciendī plūrēs librōs nūllus est fīnis.* (Ecclesiastes 12:12)"
  a: "\"Of making many books there is no end.\" *Plūrēs librōs*: object of *faciendī*."
  ref: g-10
- id: vi61-f-40
  type: forms
  q: "\"The art of reading well.\""
  a: "*Ars bene legendī.* A gerund takes an adverb, not an adjective."
  ref: g-10
- id: vi61-f-41
  type: forms
  q: "Translate *nihil in eā repperit, nisi quae ad irrīdendum eum pertinērent.* (Nepos)"
  a: "\"He found nothing in it except things meant for mocking him.\" *Ad* + gerund + object *eum*."
  ref: g-10
- id: vi61-f-42
  type: forms
  q: "*mōnstrum horrendum, iūs iūrandum, disputandum est*: gerunds?"
  a: "No: they agree with a noun or stand with *est*. That's the gerundive (Chapter 62)."
  ref: g-10
- id: vi61-f-43
  type: forms
  q: "Law of Half Verb, Half Noun?"
  a: "Outside a noun (cases); inside a verb (objects, adverbs, deponents stay active)."
  ref: g-10
- id: vi61-f-44
  type: forms
  q: "\"We learn Latin by speaking.\""
  a: "*Latīnē loquendō discimus.*"
  ref: g-12
- id: vi61-f-45
  type: forms
  q: "In the Lectiō: *Cāseus legentibus datur, nōn dormientibus.* Gerunds?"
  a: "No: participles (dative plural, used as nouns): \"to those reading, not to those sleeping.\""
  ref: g-14
- id: vi61-f-46
  type: forms
  q: "Why does Grandma catch Grandpa's Ecclesiastes?"
  a: "*Tempus edendī* isn't in Ecclesiastes 3; the real line is *tempus tacendī et tempus loquendī*."
  ref: g-14
- id: vi61-f-47
  type: forms
  q: "Translate *Omnia tempus habent.* (Ecclesiastes 3:1)"
  a: "\"Everything has its time.\""
  ref: g-15
- id: vi61-f-48
  type: forms
  q: "*Tempus flendī et tempus rīdendī; tempus plangendī et tempus saltandī.*"
  a: "\"A time to weep and a time to laugh; a time to mourn and a time to dance.\""
  ref: g-15
- id: vi61-f-49
  type: forms
  q: "Say *legendī · capiendī · eundī · nāscendī*."
  a: "le-GEN-dee (hard g) · ka-pi-EN-dee · e-UN-dee · nahs-KEN-dee"
  ref: g-16
- id: vi61-c-01
  type: choose
  q: "\"The art of reading\""
  options:
  - "ars legere"
  - "ars legendī"
  - "ars legēns"
  a: "ars legendī"
  why: "After a noun, \"of ___ing\" is the genitive gerund."
  ref: g-04
- id: vi61-c-02
  type: choose
  q: "\"Reading is pleasant.\""
  options:
  - "Legere iūcundum est."
  - "Legendum iūcundum est."
  - "Legendī iūcundum est."
  a: "Legere iūcundum est."
  why: "The gerund has no nominative; the subject is the infinitive."
  ref: g-03
- id: vi61-c-03
  type: choose
  q: "\"Ready for eating\""
  options:
  - "parātus ad edendō"
  - "parātus ad edendum"
  - "parātus ad edere"
  a: "parātus ad edendum"
  why: "*Ad* takes the accusative: *-ndum*."
  ref: g-06
- id: vi61-c-04
  type: choose
  q: "\"We learn by reading.\""
  options:
  - "Legendō discimus."
  - "Legentēs discimus."
  - "Legendum discimus."
  a: "Legendō discimus."
  why: "\"By ___ing\" is the ablative gerund."
  ref: g-07
- id: vi61-c-05
  type: choose
  q: "\"Grandpa, reading, falls asleep.\""
  options:
  - "Avus legendī dormit."
  - "Avus legendō dormit."
  - "Avus legēns dormit."
  a: "Avus legēns dormit."
  why: "A word describing Grandpa is the participle; it agrees with *Avus*."
  ref: g-09
- id: vi61-c-06
  type: choose
  q: "\"It's time to go!\""
  options:
  - "Tempus est eundī!"
  - "Tempus est īrendī!"
  - "Tempus est iendī!"
  a: "Tempus est eundī!"
  why: "*Eō* builds on *euntis*: *eundī*."
  ref: g-08
- id: vi61-c-07
  type: choose
  q: "\"The art of reading well\""
  options:
  - "ars bonī legendī"
  - "ars bene legendī"
  - "ars bonā legendī"
  a: "ars bene legendī"
  why: "Inside, the gerund is a verb: it takes an adverb."
  ref: g-10
- id: vi61-e-01
  type: error
  q: "Fix: *Legendum iūcundum est.* (Reading is pleasant.)"
  a: "*Legere iūcundum est.* A subject needs the infinitive."
  ref: g-13
- id: vi61-e-02
  type: error
  q: "Fix: *Amō legendum.* (I love reading.)"
  a: "*Amō legere.* A plain object is the infinitive."
  ref: g-13
- id: vi61-e-03
  type: error
  q: "Fix: *ars legere* (the art of reading)"
  a: "*ars legendī.* After a noun: genitive gerund."
  ref: g-13
- id: vi61-e-04
  type: error
  q: "Fix: *ad legendō* (for reading)"
  a: "*ad legendum.* *Ad* takes the accusative."
  ref: g-13
- id: vi61-e-05
  type: error
  q: "Fix: *puer legendī* (the reading boy)"
  a: "*puer legēns.* Describing a person: the participle."
  ref: g-13
- id: vi61-e-06
  type: error
  q: "Fix: *amāndī* (of loving)"
  a: "*amandī.* The vowel before *-nd-* is short."
  ref: g-13
