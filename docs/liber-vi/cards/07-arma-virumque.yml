  la: Arma vi / rumque ca / nō Trō / iae quī / prīmus ab / ōrīs
  en: 'Aen. 1.1 in feet: – ˘ ˘ / – ˘ ˘ / – – / – – / – ˘ ˘ / – –'
  ref: g-05
