  - {id: ii21-v-vobiscum, type: vocab, la: "vōbīscum", en: "with y'all", ref: g-02}
  - {id: ii21-v-sibi, type: vocab, la: "sibi", en: "to/for himself, herself, themselves", ref: g-03}
  - {id: ii21-v-sui, type: vocab, la: "suī", en: "of himself, herself, themselves", ref: g-03}
