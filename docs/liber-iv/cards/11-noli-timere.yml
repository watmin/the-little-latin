cards:
- id: iv47-v-noli-timere
  type: vocab
  la: Nōlī timēre!
  en: 'Don''t be afraid! (to y''all: *Nōlīte timēre!*)'
  ref: g-01
- id: iv47-v-memento-pattern
  type: vocab
  la: Mementō!
  en: 'Remember! (to y''all: *Mementōte!*)'
  ref: g-03
- id: iv47-v-scito-pattern
