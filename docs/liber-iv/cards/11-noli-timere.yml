  la: Cāseum nē tangitō.
  en: One shall not touch the cheese (law style).
  ref: g-08
- id: iv47-v-non-occides
  type: vocab
  la: Nōn occīdēs.
  en: You shall not kill (Bible style).
  ref: g-10
- id: iv47-v-memento
