book: iii
ch: 36
page: liber-iii/12-recapitulatio-iii.md
cards:
  - {id: iii36-v-penna, type: vocab, la: "penna, pennae", en: "f., feather; (in the plural) wings", ref: g-12}
  - {id: iii36-v-cera, type: vocab, la: "cēra, cērae", en: "f., wax", ref: g-12}
  - {id: iii36-v-ala, type: vocab, la: "āla, ālae", en: "f., wing", ref: g-07}
  - {id: iii36-v-caelum, type: vocab, la: "caelum, caelī", en: "n., sky, heaven", ref: g-12}
  - {id: iii36-v-sol, type: vocab, la: "sōl, sōlis", en: "m., sun", ref: g-12}
  - {id: iii36-v-insula, type: vocab, la: "īnsula, īnsulae", en: "f., island", ref: g-12}
  - {id: iii36-v-mollis, type: vocab, la: "mollis, molle", en: "soft", ref: g-12}
  - {id: iii36-v-moneo, type: vocab, la: "moneō, monēre, monuī, monitum", en: "warn, advise", ref: g-12}
  - {id: iii36-v-cado, type: vocab, la: "cadō, cadere, cecidī, cāsum", en: "fall (*cāsus*: a fall; a case)", ref: g-01}
  - {id: iii36-v-inter-utrumque, type: vocab, la: "inter utrumque", en: "between the two (Ovid's \"middle course\")", ref: g-14}
  - {id: iii36-f-four-keys, type: forms, q: "Law of the Four Keys: what do keys 1–2, key 3, and key 4 give you?", a: "Keys 1–2: present stem (present, imperfect, future). Key 3: perfect stem (perfect, pluperfect, future perfect active). Key 4: the fourth-key adjective (finished passive).", ref: g-01}
  - {id: iii36-f-finished-fact, type: forms, q: "Law of the Finished Fact: chant the perfect of *amō*.", a: "*Amāvī, amāvistī, amāvit, amāvimus, amāvistis, amāvērunt.*", ref: g-01}
  - {id: iii36-f-irregular-perfects, type: forms, q: "\"I was · I went · I carried · I gave · I was able\"", a: "*Fuī · iī (īvī) · tulī · dedī · potuī.*", ref: g-01}
  - {id: iii36-f-casus, type: forms, q: "Where does *cāsus* (case) come from?", a: "From *cadō… cāsum*, \"fall\": a copy of Greek *ptōsis*, \"a falling.\" Each case is one way a noun \"falls.\"", ref: g-01}
  - {id: iii36-f-aspect, type: forms, q: "What is aspect? Which tense is film, which snapshot?", a: "How a verb looks at an action: imperfect = from inside (film); perfect = from outside, one finished whole (snapshot).", ref: g-02}
  - {id: iii36-f-stage-step, type: forms, q: "Law of the Stage and the Step: *Avus dormiēbat. Subitō canis lātrāvit.*", a: "*Dormiēbat* = the stage (what was going on); *lātrāvit* = the step (what happened). Ask \"And then what?\"", ref: g-02}
  - {id: iii36-f-erat-fuit, type: forms, q: "Law of Erat and Fuit: *Nox erat* vs *Fuit Īlium*?", a: "*Erat* paints the scene at the time; *fuit* states a closed fact from outside (\"Troy is no more\").", ref: g-02}
  - {id: iii36-f-eram-ero, type: forms, q: "Law of Eram and Erō: \"I had loved,\" \"I will have loved\"?", a: "*Amāveram* (perfect stem + *eram*) · *amāverō* (perfect stem + *erō*).", ref: g-03}
  - {id: iii36-f-erint, type: forms, q: "*amāvērunt · amāverint · amāverant · erunt*?", a: "They loved · they will have loved · they had loved · they will be.", ref: g-03}
  - {id: iii36-f-earlier-step, type: forms, q: "\"Grandpa came. The dog had already eaten the cheese.\"", a: "*Avus vēnit. Canis cāseum iam ēderat.* (Earlier step → pluperfect.)", ref: g-03}
  - {id: iii36-f-si-ederis, type: forms, q: "\"If you eat the cheese, Grandma will shout.\"", a: "*Sī cāseum ēderis, Avia clāmābit.* (Future perfect: the eating comes first.)", ref: g-03}
  - {id: iii36-f-relative-terms, type: forms, q: "Relative pronoun · antecedent · relative clause?", a: "A pointing word that starts a describing clause · the word it points back to · a little sentence that works like a long adjective.", ref: g-04}
  - {id: iii36-f-law-relative, type: forms, q: "Law of the Relative: *cāseus quem Pater ēmit*. Why masculine singular, why accusative?", a: "Gender and number from *cāseus*; case from its own job (Dad bought it: object).", ref: g-04}
  - {id: iii36-f-qui-chant, type: forms, q: "Chant *quī, quae, quod* singular.", a: "*Quī, cuius, cui, quem, quō · quae, cuius, cui, quam, quā · quod, cuius, cui, quod, quō.*", ref: g-04}
  - {id: iii36-f-quibus, type: forms, q: "\"The boys to whom I gave the cheese; the friends with whom I walk.\"", a: "*Puerī quibus cāseum dedī; amīcī quibuscum ambulō.*", ref: g-04}
  - {id: iii36-f-question-words, type: forms, q: "Law of the Question Words: which two shapes are new?", a: "Only *quis* (who?) and *quid* (what?); the rest is borrowed from the relative.", ref: g-05}
  - {id: iii36-f-alone-company, type: forms, q: "Law of Alone and Company: \"Who is coming?\" vs \"Which man is coming?\"", a: "*Quis venit?* (alone) · *Quī vir venit?* (with a noun).", ref: g-05}
  - {id: iii36-f-cousins, type: forms, q: "Law of the Cousins: someone · a certain man · each one?", a: "*Aliquis · vir quīdam · quisque.*", ref: g-05}
  - {id: iii36-f-voice, type: forms, q: "What is voice? Active vs passive?", a: "Does the subject do it (active, *amat*) or receive it (passive, *amātur*)?", ref: g-06}
  - {id: iii36-f-amor, type: forms, q: "Law of the Passive Endings: chant *amor*.", a: "*Amor, amāris, amātur, amāmur, amāminī, amantur.*", ref: g-06}
  - {id: iii36-f-doer-tool, type: forms, q: "Law of the Doer and the Tool: *Cāseus ab Avō editur · Cāseus manū capitur.*", a: "*Ab Avō*: the doer (*ā/ab* + abl.). *Manū*: the tool (plain abl.). Company would be *cum*.", ref: g-06}
  - {id: iii36-f-passive-clock, type: forms, q: "\"It was being read · it will be read · to be read\"", a: "*Legēbātur · legētur · legī.*", ref: g-06}
  - {id: iii36-f-two-pieces, type: forms, q: "Law of the Two Pieces: *Cāseus ēsus est*?", a: "Fourth-key adjective (agrees with the subject) + a form of *sum* (person and time).", ref: g-07}
  - {id: iii36-f-one-two, type: forms, q: "Perfect, pluperfect, future perfect passive of *amō* (\"he\")?", a: "*Amātus est · amātus erat · amātus erit.*", ref: g-07}
  - {id: iii36-f-amatus-sum, type: forms, q: "*Amātus sum* vs *amor*; *amābor* vs *amātus erō*?", a: "I was loved · I am loved; I will be loved · I will have been loved.", ref: g-07}
  - {id: iii36-f-eo, type: forms, q: "Law of Ī and E: chant *eō*. \"Go away! Go out! Come back!\"", a: "*Eō, īs, it, īmus, ītis, eunt.* · *Abī! Exī! Redī!*", ref: g-08}
  - {id: iii36-f-fero, type: forms, q: "Law of the Missing Vowel: *ferō* present and infinitive.", a: "*Ferō, fers, fert, ferimus, fertis, ferunt · ferre.*", ref: g-08}
  - {id: iii36-f-fio, type: forms, q: "*Fīō*: three meanings? \"Cheese is made from milk.\"", a: "Become · be made · happen. *Ex lacte cāseus fit.*", ref: g-08}
  - {id: iii36-f-three-wishes, type: forms, q: "Law of the Three Wishes: you want · you don't want · you'd rather?", a: "*Vīs · nōn vīs · māvīs.*", ref: g-08}
  - {id: iii36-f-degrees, type: forms, q: "Three degrees of *altus*; how is the comparative built?", a: "*Altus · altior, altius · altissimus.* *-ior/-ius* on the genitive stem; declined like *rēx/corpus*.", ref: g-09}
  - {id: iii36-f-quam-abl, type: forms, q: "\"Marcus is taller than Quīntus\" two ways.", a: "*Marcus altior est quam Quīntus · Marcus Quīntō altior est.*", ref: g-09}
  - {id: iii36-f-superlative, type: forms, q: "Superlatives of *fortis, ācer, facilis*?", a: "*Fortissimus · ācerrimus · facillimus.*", ref: g-09}
  - {id: iii36-f-five-rebels, type: forms, q: "Law of the Five Rebels: good, bad, big, small, much?", a: "*Bonus, melior, optimus · malus, peior, pessimus · magnus, maior, maximus · parvus, minor, minimus · multus, plūs, plūrimus.*", ref: g-09}
  - {id: iii36-f-how-word, type: forms, q: "Law of the How-Word: adverbs from *lentus, fortis, celer, sapiēns, facilis*.", a: "*Lentē · fortiter · celeriter · sapienter · facile.*", ref: g-10}
  - {id: iii36-f-running-steps, type: forms, q: "\"Faster · very fast · as fast as possible\"", a: "*Celerius · celerrimē · quam celerrimē.*", ref: g-10}
  - {id: iii36-f-rebels-running, type: forms, q: "Law of the Five Rebels Running: well, badly, much, little, greatly?", a: "*Bene, melius, optimē · male, peius, pessimē · multum, plūs, plūrimum · parum, minus, minimē · magnopere, magis, maximē.*", ref: g-10}
  - {id: iii36-f-three-old-jobs, type: forms, q: "Law of the Three Old Jobs?", a: "The ablative = old \"from\" + \"with / by\" + \"in / at\" cases in one coat.", ref: g-11}
  - {id: iii36-f-three-withs, type: forms, q: "Law of the Three Withs: with whom · how · with what?", a: "*Cum Avō* (company) · *magnā (cum) cūrā* (manner) · *baculō* (tool: plain).", ref: g-11}
  - {id: iii36-f-six-questions, type: forms, q: "*Metū · multō maior · nātū maior · vir magnā barbā*: ask each its question.", a: "Why? (cause) · by how much? (degree) · in what respect? (respect) · what kind? (description).", ref: g-11}
  - {id: iii36-f-medio, type: forms, q: "*Mediō tūtissimus ībis*: Daedalus to Icarus?", a: "No: the Sun to his son Phaethon (Ovid, *Metamorphoses* 2.137). Daedalus says *inter utrumque volā* (8.206).", ref: g-14}
  - {id: iii36-f-tabuerant, type: forms, q: "*Tābuerant cērae* (Ovid, *Met.* 8.227): tense and meaning?", a: "Pluperfect: \"the wax had melted\" (before the fall).", ref: g-14}
  - {id: iii36-f-icare, type: forms, q: "*\"Īcare,\" dīxit, \"Īcare,\" dīxit, \"ubi es?\"*", a: "\"'Icarus,' he said, 'Icarus,' he said, 'where are you?'\" (Ovid, *Met.* 8.231–232.)", ref: g-14}
  - {id: iii36-f-didicisti, type: forms, q: "Parse *Quid didicistī?*", a: "\"What have you learned?\" *Didicistī* = perfect of *discō* (key 3 *didicī*), \"you\" form.", ref: g-15}
  - {id: iii36-c-ederat, type: choose, q: "\"The dog **had** already eaten the cheese\": *Canis cāseum iam ___.*", options: ["ēderat", "ēdit", "ēderit"], a: "ēderat", why: "Earlier than a past step: pluperfect.", ref: g-03}
  - {id: iii36-c-quem, type: choose, q: "\"The cheese that Dad bought\": *cāseus ___ Pater ēmit*", options: ["quem", "quī", "quod"], a: "quem", why: "Masculine singular from *cāseus*; accusative because it is Dad's object.", ref: g-04}
  - {id: iii36-c-quis, type: choose, q: "\"Who is coming?\": *___ venit?*", options: ["Quis", "Quī", "Quod"], a: "Quis", why: "Alone (no noun), so *quis*.", ref: g-05}
  - {id: iii36-c-ab-avo, type: choose, q: "\"The cheese is eaten by Grandpa\": *Cāseus ___ editur.*", options: ["ab Avō", "Avō", "cum Avō"], a: "ab Avō", why: "A doer in a passive sentence takes *ā/ab* + ablative.", ref: g-06}
  - {id: iii36-c-factae, type: choose, q: "\"The wings were made\": *Ālae ___ sunt.*", options: ["factae", "factī", "factum"], a: "factae", why: "The fourth-key adjective agrees with *ālae*: feminine plural.", ref: g-07}
  - {id: iii36-c-mavis, type: choose, q: "\"Would you rather have cheese or cookies?\": *Cāseum an crustula ___?*", options: ["māvīs", "mālvīs", "māvult"], a: "māvīs", why: "Three Wishes: *vīs* gets *mā-* in front; \"you\" form.", ref: g-08}
  - {id: iii36-c-celeriter, type: choose, q: "\"Cornēlia runs fast\": *Cornēlia ___ currit.*", options: ["celeriter", "celeris", "celerē"], a: "celeriter", why: "It describes the running: an adverb (third family *-iter*).", ref: g-10}
  - {id: iii36-c-baculo, type: choose, q: "\"Grandpa walks with a stick\": *Avus ___ ambulat.*", options: ["baculō", "cum baculō", "baculum"], a: "baculō", why: "A tool is a plain ablative.", ref: g-11}
  - {id: iii36-e-quam-qui, type: error, q: "Fix: *Cāseus quī Pater ēmit* (\"the cheese that Dad bought\")", a: "*Cāseus quem Pater ēmit.* The relative is Dad's object: accusative.", ref: g-04}
  - {id: iii36-e-a-manu, type: error, q: "Fix: *Cāseus ā manū capitur* (\"the cheese is taken with the hand\")", a: "*Cāseus manū capitur.* A tool is a plain ablative; *ā/ab* is for the doer.", ref: g-06}
  - {id: iii36-e-facti, type: error, q: "Fix: *Ālae factī sunt*", a: "*Ālae factae sunt.* Feminine plural to match *ālae*.", ref: g-07}
  - {id: iii36-e-iunt, type: error, q: "Fix: *Īunt* (\"they go\")", a: "*Eunt.* Law of Ī and E: *e-* before a vowel.", ref: g-08}
  - {id: iii36-e-magis-bonus, type: error, q: "Fix: *magis bonus* (\"better\")", a: "*Melior.* *Bonus* is one of the Five Rebels.", ref: g-09}
