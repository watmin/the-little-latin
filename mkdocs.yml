site_name: The Little Latin
site_url: https://watmin.github.io/the-little-latin/
repo_url: https://github.com/watmin/the-little-latin
theme:
  name: material
  features: [navigation.instant, navigation.indexes, navigation.tracking, navigation.top, navigation.footer, search.suggest, search.highlight, content.code.copy]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
plugins: [search]
hooks: [hooks/frames.py]
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/extra.js]
markdown_extensions: [toc: {permalink: true}, admonition, pymdownx.details, pymdownx.superfences, tables, attr_list, md_in_html, {pymdownx.tasklist: {custom_checkbox: true, clickable_checkbox: true}}]
nav:
  - Home: index.md
  - "Liber I: Prīma Verba":
      - liber-i/index.md
      - "I. Salvē!": liber-i/01-salve.md
      - "II. Quid est?": liber-i/02-quid-est.md
      - "III. Magnus et Parvus": liber-i/03-magnus-et-parvus.md
  - "Liber II: Rēs Cotīdiānae":
      - liber-ii/index.md
  - "Liber III: Fābulae":
      - liber-iii/index.md
  - "Liber IV: Verba Agentia":
      - liber-iv/index.md
  - "Liber V: Modus Subiūnctīvus":
      - liber-v/index.md
  - "Liber VI: Ad Auctōrēs":
      - liber-vi/index.md
