site_name: The Little Latin
site_url: https://watmin.github.io/the-little-latin/
repo_url: https://github.com/watmin/the-little-latin
theme:
  name: material
  features: [navigation.instant, navigation.indexes, navigation.tracking, navigation.top, navigation.footer, search.suggest, search.highlight, content.code.copy]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
plugins: [search]
hooks: [hooks/frames.py]
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/extra.js, javascripts/cards.js]
markdown_extensions: [toc: {permalink: true}, admonition, pymdownx.details, pymdownx.superfences, tables, attr_list, md_in_html, {pymdownx.tasklist: {custom_checkbox: true, clickable_checkbox: true}}]
nav:
  - Home: index.md
  - "Tabellae · Cards": tabellae.md
  - "Liber I: Prīma Verba":
      - liber-i/index.md
      - "I. Salvē!": liber-i/01-salve.md
      - "II. Quid est?": liber-i/02-quid-est.md
      - "III. Magnus et Parvus": liber-i/03-magnus-et-parvus.md
      - "IV. Marcus pōmum edit": liber-i/04-marcus-pomum-edit.md
      - "V. Ego et Tū": liber-i/05-ego-et-tu.md
      - "VI. Audī! Venī!": liber-i/06-audi-veni.md
      - "VII. Ubi est?": liber-i/07-ubi-est.md
      - "VIII. Quō īs?": liber-i/08-quo-is.md
      - "IX. Quīnte!": liber-i/09-quinte.md
      - "X. Liber Puerī": liber-i/10-liber-pueri.md
      - "XI. Dā mihi pānem": liber-i/11-da-mihi-panem.md
      - "XII. Recapitulātiō I": liber-i/12-recapitulatio-i.md
  - "Liber II: Rēs Cotīdiānae":
      - liber-ii/index.md
      - "XIII. Rēx et Mīles": liber-ii/01-rex-et-miles.md
      - "XIV. Corpus et Nōmen": liber-ii/02-corpus-et-nomen.md
      - "XV. Ovēs et Mare": liber-ii/03-oves-et-mare.md
      - "XVI. Heri et Crās": liber-ii/04-heri-et-cras.md
      - "XVII. Legam, Audiam": liber-ii/05-legam-audiam.md
      - "XVIII. Possum!": liber-ii/06-possum.md
      - "XIX. Hic et Ille": liber-ii/07-hic-et-ille.md
      - "XX. Fortis et Celer": liber-ii/08-fortis-et-celer.md
      - "XXI. Sē et Suum": liber-ii/09-se-et-suum.md
      - "XXII. Ūnus, Duo, Trēs": liber-ii/10-unus-duo-tres.md
      - "XXIII. Manus et Diēs": liber-ii/11-manus-et-dies.md
      - "XXIV. Recapitulātiō II": liber-ii/12-recapitulatio-ii.md
  - "Liber III: Fābulae":
      - liber-iii/index.md
      - "XXV. Vēnī, Vīdī, Vīcī": liber-iii/01-veni-vidi-vici.md
      - "XXVI. Erat et Fuit": liber-iii/02-erat-et-fuit.md
      - "XXVII. Iam Fēceram": liber-iii/03-iam-feceram.md
  - "Liber IV: Verba Agentia":
      - liber-iv/index.md
  - "Liber V: Modus Subiūnctīvus":
      - liber-v/index.md
  - "Liber VI: Ad Auctōrēs":
      - liber-vi/index.md
